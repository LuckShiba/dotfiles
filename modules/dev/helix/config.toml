theme = "neonotte84"

[editor]
bufferline = "multiple"
cursorline = true
end-of-line-diagnostics = "hint"
color-modes = true

[editor.breadcrumb]
enable = true

[editor.indent-guides]
render = true
skip-levels = 1

[editor.cursor-shape]
insert = "bar"

[editor.inline-diagnostics]
cursor-line = "warning"

[keys.normal]
tab = "move_parent_node_end"
S-tab = "move_parent_node_start"
S-ret = ":write"
A-w = ["move_prev_word_start", "move_next_word_end"]
A-W = ["move_prev_long_word_start", "move_next_long_word_end"]

[keys.insert]
S-tab = "move_parent_node_start"
S-ret = ":write"

[keys.select]
tab = "extend_parent_node_end"
S-tab = "extend_parent_node_start"
S-ret = ":write"
A-w = ["move_prev_word_start", "move_next_word_end"]
A-W = ["move_prev_long_word_start", "move_next_long_word_end"]

[editor.statusline]
left = ["mode", "spacer", "spinner", "spacer", "version-control"]

center = ["file-name", "read-only-indicator", "file-modification-indicator"]

right = ["workspace-diagnostics", "spacer", "selections", "spacer", "position", "position-percentage", "spacer", "file-type", "file-encoding"]

