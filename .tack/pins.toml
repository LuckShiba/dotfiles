# tack pins
# edit by hand or with tack add / rm / alias
# nix reads pins.lock.json
# this file drives tack update

[tack]
recomposable = true

# shorturl schemes
# scheme rest expands rest into {path}
[shorturls]
gh = "github:{path}"
dux = "gh:duxlabs-dev/{path}"
me = "gh:LuckShiba/{path}"

# all_follow maps input names to the top-level pin they follow
# opt out per-input with exclude_follow
[all_follow]
nixpkgs = "nixpkgs"

# auto-dedup (no top-level pin needed):
fenix             = "fenix"
rust-analyzer-src = "rust-analyzer"
# rust-overlay      = "rust-overlay"

# inputs.<name> fields
#   url             required, shorturl ok, ?rev=<sha> pins an exact commit
#   type            flake (default), fetch, or fixed
#   flake           legacy false means type = "fetch"
#   follows         { child = "pin" } override map
#   exclude_follow  all_follow names to skip
#   dir             subdir holding flake.nix
#   submodules      fetch git submodules
#   unpack          fixed-only tarball or file
[inputs]

[inputs.nixpkgs]
url = "gh:NixOS/nixpkgs/nixpkgs-unstable"


[inputs.dux-greeter]
url = "dux:dux-greeter"

[inputs.dux-shell]
url = "dux:dux-shell"

[inputs.dux-shell.follows]
flake-compat = ""

[inputs.dux-calendar]
url = "dux:dux-calendar"

[inputs.dux-plugin-registry]
url = "dux:dux-plugin-registry"


[inputs.niri]
url = "me:niri"

[inputs.fructose]
url = "me:fructose"

[inputs.helix]
url = "me:helix"


[inputs.hjem]
url = "gh:feel-co/hjem"

[inputs.xwl-s]
url = "gh:Supreeeme/xwayland-satellite"

[inputs.zen-browser]
url = "gh:0xc000022070/zen-browser-flake/beta"

[inputs.zen-browser.follows]
home-manager = ""

[inputs.tack]
url = "gh:manic-systems/tack"
